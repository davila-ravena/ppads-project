<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Área do Gerente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1, h2 {
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: center;
        }
        input, select, button {
            padding: 8px;
            margin: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            table-layout: fixed;
            overflow-x: auto;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            word-wrap: break-word;
        }
        table thead th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .remove-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* NOVO - Botão Editar */
        .edit-btn {
            background-color: #ffc107;
            color: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 5px;
        }
        .edit-btn:hover {
            background-color: #e0a800;
        }

        .nav-btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            text-align: center;
            background-color: #007bff;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
        }
        .nav-btn:hover {
            background-color: #0056b3;
        }
        .relatorio {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Área do Gerente</h1>
    <div class="container">

        <h2>Adicionar Item ao Cardápio</h2>
        <div class="form-group">
            <input type="text" id="nomeItem" placeholder="Nome do item">
            <input type="number" id="precoItem" placeholder="Preço" step="0.01">
            <select id="categoriaItem">
                <option value="Hamburgueres">Hambúrgueres</option>
                <option value="Pizzas">Pizzas</option>
                <option value="Bebidas">Bebidas</option>
                <option value="Sobremesas">Sobremesas</option>
            </select>
            <button onclick="adicionarItem()">Adicionar</button>
        </div>

        <h2>Cardápio Atual</h2>
        <table id="tabelaCardapio">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="relatorio">
            <h2>Relatórios</h2>

            <div class="form-group">
                <label>Filtrar por data: </label>
                <input type="date" id="filtroData" onchange="atualizarRelatorio()">

                <label>Filtrar por categoria: </label>
                <select id="filtroCategoria" onchange="atualizarRelatorio()">
                    <option value="">Todas</option>
                    <option value="Hamburgueres">Hambúrgueres</option>
                    <option value="Pizzas">Pizzas</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Sobremesas">Sobremesas</option>
                </select>
            </div>

            <p><strong>Total de pedidos:</strong> <span id="totalPedidos">0</span></p>
            <p><strong>Total faturado:</strong> R$ <span id="totalFaturado">0.00</span></p>

            <h3>Detalhes dos pedidos</h3>
            <table id="tabelaRelatorio">
                <thead>
                    <tr>
                        <th>Data e Hora</th>
                        <th>Itens</th>
                        <th>Total (R$)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <a href="cardapio.html" class="nav-btn">Ir para o Cardápio</a>
        <a href="index.html" class="nav-btn">Voltar ao Login</a>

    </div>

    <script>

        /* DADOS DO CARDÁPIO */
        let itens = JSON.parse(localStorage.getItem("cardapio")) || [
            { nome: "Cheeseburguer", preco: 20.00, categoria: "Hamburgueres" },
            { nome: "Pizza Calabresa", preco: 35.00, categoria: "Pizzas" },
            { nome: "Refrigerante", preco: 8.00, categoria: "Bebidas" },
            { nome: "Sorvete", preco: 12.00, categoria: "Sobremesas" }
        ];

        let pedidos = JSON.parse(localStorage.getItem("pedidosFinalizados")) || [];

        const tabelaCardapio = document.querySelector("#tabelaCardapio tbody");
        const tabelaRelatorio = document.querySelector("#tabelaRelatorio tbody");
        const totalPedidos = document.getElementById("totalPedidos");
        const totalFaturado = document.getElementById("totalFaturado");

        function salvarItens() {
            localStorage.setItem("cardapio", JSON.stringify(itens));
        }

        function renderizarCardapio() {
            tabelaCardapio.innerHTML = "";
            itens.forEach((item, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.nome}</td>
                    <td>R$ ${item.preco.toFixed(2)}</td>
                    <td>${item.categoria}</td>
                    <td>
                        <button class="edit-btn" onclick="editarPreco(${index})">Editar</button>
                        <button class="remove-btn" onclick="removerItem(${index})">Remover</button>
                    </td>
                `;
                tabelaCardapio.appendChild(tr);
            });
        }

        function adicionarItem() {
            const nome = document.getElementById("nomeItem").value.trim();
            const preco = parseFloat(document.getElementById("precoItem").value);
            const categoria = document.getElementById("categoriaItem").value;

            if (!nome || isNaN(preco) || preco <= 0) {
                alert("Preencha um nome válido e um preço maior que zero!");
                return;
            }

            itens.push({ nome, preco, categoria });
            salvarItens();
            renderizarCardapio();

            document.getElementById("nomeItem").value = "";
            document.getElementById("precoItem").value = "";
            document.getElementById("categoriaItem").value = "Hamburgueres";
        }

        function removerItem(index) {
            itens.splice(index, 1);
            salvarItens();
            renderizarCardapio();
        }

        /* FUNÇÃO NOVA — EDITAR PREÇO */
        function editarPreco(index) {
            const item = itens[index];
            const novoPreco = prompt(
                `Editar preço de "${item.nome}".\nPreço atual: R$ ${item.preco.toFixed(2)}\n\nDigite o novo preço:`
            );

            if (novoPreco === null) return;

            const precoNum = parseFloat(novoPreco);

            if (isNaN(precoNum) || precoNum <= 0) {
                alert("Digite um valor válido!");
                return;
            }

            itens[index].preco = precoNum;
            salvarItens();
            renderizarCardapio();
            alert("Preço atualizado!");
        }

        function atualizarRelatorio() {
            const filtroData = document.getElementById("filtroData").value;
            const filtroCategoria = document.getElementById("filtroCategoria").value;

            tabelaRelatorio.innerHTML = "";
            let total = 0;
            let totalPedidosFiltrados = 0;

            pedidos.forEach(pedido => {

                const dataHora = pedido.dataHora || pedido.data || "";
                const dataSomente = dataHora.split(" ")[0];

                const [dia, mes, ano] = dataSomente.split("/");
                const dataFormatada = `${ano}-${mes}-${dia}`;

                if (filtroData && dataFormatada !== filtroData) return;

                if (filtroCategoria) {
                    const temCategoria = pedido.itens.some(item => item.categoria === filtroCategoria);
                    if (!temCategoria) return;
                }

                const totalPedido = pedido.total || pedido.itens.reduce((s, item) => s + item.preco, 0);
                const nomesItens = pedido.itens.map(i => i.nome).join(", ");

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${dataHora}</td>
                    <td>${nomesItens}</td>
                    <td>${totalPedido.toFixed(2)}</td>
                `;

                tabelaRelatorio.appendChild(tr);

                total += totalPedido;
                totalPedidosFiltrados++;
            });

            totalPedidos.textContent = totalPedidosFiltrados;
            totalFaturado.textContent = total.toFixed(2);
        }

        renderizarCardapio();
        atualizarRelatorio();

    </script>

</body>
</html>
