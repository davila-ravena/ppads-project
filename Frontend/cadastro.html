<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: left;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        a {
            display: block;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
        #mensagem {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form onsubmit="validarCadastro(event)">
        <h2>Cadastro de Usuário</h2>

        <input type="text" id="nome" placeholder="Nome" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="tel" id="telefone" placeholder="Telefone" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <input type="password" id="confirmar" placeholder="Confirme a senha" required>

        <button type="submit">Cadastrar</button>

        <p id="mensagem"></p>

        <a href="index.html">Voltar ao login</a>
    </form>

    <script>

        // Simulando base de emails já cadastrados (mesmos do login)
        const emailsExistentes = [
            "cliente@teste.com",
            "gerente@teste.com"
        ];

        function validarCadastro(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const telefone = document.getElementById("telefone").value.trim();
            const senha = document.getElementById("senha").value.trim();
            const confirmar = document.getElementById("confirmar").value.trim();
            const msg = document.getElementById("mensagem");

            msg.textContent = "";
            msg.style.display = "block";

            // 1) Campo obrigatório vazio
            if (!nome || !email || !telefone || !senha || !confirmar) {
                msg.style.color = "red";
                msg.textContent = "Preencha todos os campos!";
                return;
            }

            // 2) Email já cadastrado
            if (emailsExistentes.includes(email)) {
                msg.style.color = "red";
                msg.textContent = "Email já cadastrado.";
                return;
            }

            // 3) Senhas diferentes
            if (senha !== confirmar) {
                msg.style.color = "red";
                msg.textContent = "As senhas não coincidem!";
                return;
            }

            // 4) Cadastro válido
            msg.style.color = "green";
            msg.textContent = "Cadastro finalizado com sucesso!";
        }

    </script>
</body>
</html>
